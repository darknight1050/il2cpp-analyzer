# Production stack. Everything binds to loopback only - put a reverse proxy in
# front of the app if it needs to be reachable from outside the host.
#
#   production:   docker compose up -d
#   development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Settings come from .env (see .env.example).

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - ${ES_DATA_PATH:-./elasticsearch-data}:/usr/share/elasticsearch/data
    ports:
      - 127.0.0.1:${ES_PORT:-9200}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mongodb:
    # Pin to the major you already run - MongoDB refuses to start on a data
    # directory written by a newer release. Check with db.version().
    image: mongo:${MONGO_VERSION:-8}
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?set MONGO_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - ${MONGO_DATA_PATH:-./db}:/data/db
    ports:
      - 127.0.0.1:${MONGO_PORT:-27017}:27017
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB:-analyzer}?ssl=false&authSource=admin
      - ELASTICSEARCH_URI=http://elasticsearch:9200
      - PORT=5000
    volumes:
      # The symbol cache is many GB and must outlive the container.
      - ${VERSIONS_PATH:-./versions}:/app/versions
    ports:
      - 127.0.0.1:${APP_PORT:-5000}:5000
    healthcheck:
      # loadVersions() scans the whole symbol cache before the server listens,
      # so allow a long start_period on a big cache.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/versions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
